[project]
name = "stuck-pixels"
version = "0.1.0"
description = "Find stuck/hot/dead pixels across a folder of camera raw files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "rawpy>=0.28.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
stuck-pixels = "stuck_pixels:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["stuck_pixels.py"]
